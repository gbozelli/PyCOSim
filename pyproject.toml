[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simcopy"
version = "0.1.0.dev0"
description = "Simulador modular de sistemas de comunicacoes opticas (WDM, IMDD e coerente digital)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0", "scipy>=1.11", "pyyaml>=6.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = ["pytest", "ruff", "mypy", "import-linter"]

[project.scripts]
simcopy = "simcopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/simcopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 92

[tool.importlinter]
root_package = "simcopy"
[[tool.importlinter.contracts]]
name = "Camadas: core < config < validation < kernels < components < pipelines"
type = "layers"
layers = ["simcopy.pipelines", "simcopy.components", "simcopy.kernels",
          "simcopy.validation", "simcopy.config", "simcopy.core"]
