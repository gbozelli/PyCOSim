name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check packaging metadata
        id: package_check
        run: |
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            echo "package_exists=true" >> $GITHUB_OUTPUT
          else
            echo "package_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install build dependencies
        if: steps.package_check.outputs.package_exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build binary wheel and source tarball
        if: steps.package_check.outputs.package_exists == 'true'
        run: python -m build

      - name: Publish package distributions to PyPI
        if: steps.package_check.outputs.package_exists == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        # Recommending Trusted Publishing (OIDC) instead of manual tokens
        # See: https://docs.pypi.org/trusted-publishers/
